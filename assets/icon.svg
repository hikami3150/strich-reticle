<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="46" fill="#141814" stroke="#4a5d4e" stroke-width="3"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#2e3a30" stroke-width="1"/>
  <!-- Central crosshair lines -->
  <line x1="8" y1="50" x2="33" y2="50" stroke="#ffb834" stroke-width="1.5"/>
  <line x1="67" y1="50" x2="92" y2="50" stroke="#ffb834" stroke-width="1.5"/>
  <line x1="50" y1="58" x2="50" y2="92" stroke="#ffb834" stroke-width="1.5"/>
  <!-- Hauptstachel (Central hollow triangle) -->
  <polygon points="50,42 44,50 56,50" fill="none" stroke="#ffb834" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Nebenstachel (Left/Right open chevron marks ^) -->
  <polyline points="40,49 38,45 36,49" fill="none" stroke="#ffb834" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="60,49 62,45 64,49" fill="none" stroke="#ffb834" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
